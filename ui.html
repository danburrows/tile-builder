<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tile Builder</title>
  <style>
    body {
      font-family: Inter, system-ui, sans-serif;
      padding: 10px;
      font-size: 12px;
    }

    h3 {
      margin: 16px 0 12px;
      font-size: 18px;
      font-weight: 600;
    }

    .group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-bottom: 6px;
    }

    input[type="number"] {
      width: 100%;
      box-sizing: border-box;
      padding: 6px;
      margin: 8px 0;
      font-size: 12px;
    }

    button {
      width: 100%;
      padding: 8px;
      font-size: 12px;
      cursor: pointer;
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 16px 0;
    }

    .divider {
      height: 1px;
      background: #e5e5e5;
      margin: 16px 0;
    }

    .note {
      margin-bottom: 20px;
      font-size: 10px;
    }
  </style>
</head>
<body>

  <!-- Global toggle -->
  <div class="checkbox">
    <input type="checkbox" id="noShrink" />
    <label for="noShrink">Generate without margins</label>
  </div>

  <div class="divider"></div>

  <!-- Large tile -->
  <div class="group">
    <h3>Large tile</h3>

    <label>
      Width
      <input id="largeWidth" type="number" value="1080" />
    </label>

    <label>
      Height
      <input id="largeHeight" type="number" value="1920" />
    </label>

    <button id="generateLarge">Generate large</button>
  </div>

  <div class="divider"></div>

  <!-- Small tile -->
  <div class="group">
    <h3>Small tile</h3>
        <div class="note">
      A minimum of 6px is set to prevent visual collapse at small sizes.
    </div>

    <label>
      Width
      <input id="smallWidth" type="number" value="300" />
    </label>

    <label>
      Height
      <input id="smallHeight" type="number" value="250" />
    </label>

    <button id="generateSmall">Generate small</button>
  </div>

<script>
  function generate(tileType) {
    const noShrink = document.getElementById("noShrink").checked;

    const width =
      tileType === "large"
        ? Number(document.getElementById("largeWidth").value)
        : Number(document.getElementById("smallWidth").value);

    const height =
      tileType === "large"
        ? Number(document.getElementById("largeHeight").value)
        : Number(document.getElementById("smallHeight").value);

    parent.postMessage(
      {
        pluginMessage: {
          type: "generate",
          width,
          height,
          tileType,
          noShrink
        }
      },
      "*"
    );
  }

  document.getElementById("generateLarge").onclick = () => {
    generate("large");
  };

  document.getElementById("generateSmall").onclick = () => {
    generate("small");
  };
</script>

</body>
</html>
